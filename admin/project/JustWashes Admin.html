  .mono{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace}

  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#dbe1ec;border-radius:8px;border:2px solid var(--bg)}
